<!DOCTYPE html><html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一个网页</title><style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #f0f4f8;
        padding: 60px 20px;
    }

    .card {
        background: white;
        padding: 30px;
        border-radius: 15px;
        max-width: 500px;
        margin: auto;
    }

    h1 {
        color: #2563eb;
    }

    p {
        color: #555;
        line-height: 1.8;
    }

    button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        cursor: pointer;
    }
</style>

</head><body>
    <div class="card">
        <h1>欢迎来到我的网站！</h1>    <p>这是我使用 HTML 制作的第一个网页。</p>

    <p>我正在学习网页开发。</p>

    <button onclick="alert('恭喜你！网页交互功能运行成功！')">
        点击我
    </button>
</div>

</body>
</html>
